services:
  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL + PostGIS
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: aaspaas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aaspaas
      POSTGRES_PASSWORD: aaspaas_dev_password
      POSTGRES_DB: aaspaas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaspaas -d aaspaas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aaspaas_network

  # ──────────────────────────────────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: aaspaas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass aaspaas_redis_dev_password --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "aaspaas_redis_dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aaspaas_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aaspaas_network:
    driver: bridge
